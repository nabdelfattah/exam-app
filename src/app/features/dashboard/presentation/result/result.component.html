<h3 class="text-2xl font-semibold text-primary font-geist mb-4">Result</h3>

<div class="grid gap-4 grid-cols-1 lg:grid-cols-[275fr_691fr]">
  <!-- statistics -->
  <div class="h-full overflow-y-auto bg-blue-50 flex items-center justify-center p-2"></div>

  <!-- answers -->
  <ul
    class="min-h-0 h-full overflow-y-auto p-4 flex flex-col gap-5 border border-dashed border-blue-200 font-geist"
  >
    @for (question of data()?.analytics; track question.questionId) {
      <li class="flex flex-col gap-2.5">
        <h4 class="text-xl font-semibold text-primary">{{ question.questionText }}</h4>
      </li>
    }
  </ul>
</div>
