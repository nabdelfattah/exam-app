<a
  [routerLink]="`/diplomas/questions/${data()?.id}`"
  class="bg-blue-50 py-4.5 px-4 flex gap-4 transition duration-150 border border-transparent hover:border hover:border-blue-200 outline-none focus-visible:border-blue-200 focus-visible:outline-none"
>
  <div class="border border-primary">
    <img [src]="data()?.image" [alt]="data()?.title" class="h-25 w-25 object-cover" />
  </div>

  <div class="font-geist w-full">
    <div class="flex justify-between items-center mb-1.5">
      <p class="text-primary font-semibold text-xl shrink">
        {{ data()?.title }}
      </p>

      <div class="flex flex-wrap shrink-0 min-w-fit text-black text-sm font-normal">
        <div class="flex gap-1.5 px-1.5 border-r border-r-[#CBD5E1]">
          <img src="/assets/icons/circle-question-mark.svg" alt="circle question mark icon" />
          <p>{{ data()?.questionsCount }}&nbsp;Questions</p>
        </div>
        <div class="flex gap-1.5 px-1.5">
          <img src="/assets/icons/timer.svg" alt="timer icon" />
          <p>{{ data()?.duration }}&nbsp;minutes</p>
        </div>
      </div>
    </div>

    <div>
      <p class="text-sm text-gray-500">{{ data()?.description }}</p>
    </div>
  </div>
</a>
