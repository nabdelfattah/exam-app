<div class="lg:min-w-113 min-w-80 p-5">
  <h1 class="h1 mb-1.5">Create a New Password</h1>
  <p class="description mb-6">Create a new strong password for your account.</p>
  <form [formGroup]="resetForm" (ngSubmit)="submitHandler()">
    <div class="flex flex-col gap-4">
      <app-field
        controlName="password"
        label="New Password"
        placeholder="********"
        type="password"
        [errorMessages]="{
          required: 'Your password is required',
          pattern:
            'Must contain at least 8 chars, 1 uppercase, 1 lowercase, 1 number, and 1 special',
        }"
      />
      <app-field
        controlName="rePassword"
        label="Confirm New Password"
        placeholder="********"
        type="password"
        [errorMessages]="{
          required: 'Your password is required',
          mismatch: 'Passwords do not match',
        }"
      />
    </div>

    <!-- toast -->
    @if (displayToast()) {
      <app-toast (toastEvent)="displayToast.set($event)" />
    }

    <!-- next button -->
    <div class="mt-10">
      <app-button label="submit" type="submit">Reset Password</app-button>
    </div>
    <div class="mt-9 text-center">
      <p class="font-geist font-medium text-sm">
        Don’t have an account? <app-link link="/register">Create yours</app-link>
      </p>
    </div>
  </form>
</div>
