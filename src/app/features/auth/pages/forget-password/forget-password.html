<div class="lg:w-113 min-w-80 p-5">
  <h1 class="h1 mb-1.5">Forgot Password</h1>
  <p class="description mb-6">Don’t worry, we will help you recover your account.</p>
  <form [formGroup]="forgetForm" (ngSubmit)="submitHandler()">
    <div class="flex flex-col gap-4">
      <app-field
        controlName="email"
        label="Email"
        placeholder="user@example.com"
        type="email"
        [errorMessages]="{
          required: 'Your Email is required',
          email: 'Please, enter a valid email',
        }"
      />
    </div>

    <!-- toast -->
    @if (displayToast()) {
      <app-toast (toastEvent)="displayToast.set($event)" [message]="errMsg()" />
    }

    <!-- next button -->
    <div class="mt-10">
      <app-button label="Next" type="submit"
        ><img src="/assets/icons/chevron-right-light.svg" alt="arrow icon" class="order-last w-4"
      /></app-button>
    </div>
    <div class="mt-9 text-center">
      <p class="font-geist font-medium text-sm">
        Don’t have an account? <app-link link="/register">Create yours</app-link>
      </p>
    </div>
  </form>
</div>
