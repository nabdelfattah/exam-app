<div class="card flex justify-content-center">
  <p-stepper [value]="1">
    <p-step-list>
      <p-step [value]="1">
        <ng-template #content let-activateCallback="activateCallback" let-active="active">
          <button class="step-diamond-btn" (click)="activateCallback()" type="button">
            <svg
              width="15"
              height="15"
              viewBox="0 0 15 15"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect
                x="7.07104"
                width="10"
                height="10"
                transform="rotate(45 7.07104 0)"
                [attr.fill]="active ? 'var(--color-primary)' : 'white'"
                [attr.stroke]="'var(--color-primary)'"
                stroke-width="1"
              />
            </svg>
          </button>
        </ng-template>
      </p-step>

      <p-step [value]="2">
        <ng-template #content let-activateCallback="activateCallback" let-active="active">
          <button class="step-diamond-btn" (click)="activateCallback()" type="button">
            <svg
              width="15"
              height="15"
              viewBox="0 0 15 15"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect
                x="7.07104"
                width="10"
                height="10"
                transform="rotate(45 7.07104 0)"
                [attr.fill]="active ? 'var(--color-primary)' : 'white'"
                [attr.stroke]="'var(--color-primary)'"
                stroke-width="1"
              />
            </svg>
          </button>
        </ng-template>
      </p-step>

      <p-step [value]="3">
        <ng-template #content let-activateCallback="activateCallback" let-active="active">
          <button class="step-diamond-btn" (click)="activateCallback()" type="button">
            <svg
              width="15"
              height="15"
              viewBox="0 0 15 15"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect
                x="7.07104"
                width="10"
                height="10"
                transform="rotate(45 7.07104 0)"
                [attr.fill]="active ? 'var(--color-primary)' : 'white'"
                [attr.stroke]="'var(--color-primary)'"
                stroke-width="1"
              />
            </svg>
          </button>
        </ng-template>
      </p-step>

      <p-step [value]="4">
        <ng-template #content let-activateCallback="activateCallback" let-active="active">
          <button class="step-diamond-btn" (click)="activateCallback()" type="button">
            <svg
              width="15"
              height="15"
              viewBox="0 0 15 15"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect
                x="7.07104"
                width="10"
                height="10"
                transform="rotate(45 7.07104 0)"
                [attr.fill]="active ? 'var(--color-primary)' : 'white'"
                [attr.stroke]="'var(--color-primary)'"
                stroke-width="1"
              />
            </svg>
          </button>
        </ng-template>
      </p-step>
    </p-step-list>

    <p-step-panels>
      <!-- step 1: Email -->
      <p-step-panel [value]="1">
        <ng-template #content let-activateCallback="activateCallback">
          <app-register-email />
        </ng-template>
      </p-step-panel>

      <!-- step 2: OTP -->
      <p-step-panel [value]="2">
        <ng-template #content let-activateCallback="activateCallback">
          <div class="flex flex-column h-12rem">
            <div
              class="border-2 border-dashed surface-border border-round surface-ground flex-auto flex justify-content-center align-items-center font-medium"
            >
              Content II
            </div>
          </div>
          <div class="flex pt-4 justify-content-between">
            <p-button label="Back" icon="pi pi-arrow-left" (onClick)="activateCallback(1)" />
            <p-button
              label="Next"
              icon="pi pi-arrow-right"
              iconPos="right"
              (onClick)="activateCallback(3)"
            />
          </div>
        </ng-template>
      </p-step-panel>

      <!-- step 3: personal info -->
      <p-step-panel [value]="3">
        <ng-template #content let-activateCallback="activateCallback">
          <div class="flex flex-column h-12rem">
            <div
              class="border-2 border-dashed surface-border border-round surface-ground flex-auto flex justify-content-center align-items-center font-medium"
            >
              Content II
            </div>
          </div>
          <div class="flex pt-4 justify-content-between">
            <p-button label="Back" icon="pi pi-arrow-left" (onClick)="activateCallback(1)" />
            <p-button
              label="Next"
              icon="pi pi-arrow-right"
              iconPos="right"
              (onClick)="activateCallback(3)"
            />
          </div>
        </ng-template>
      </p-step-panel>

      <!-- step 4: password -->
      <p-step-panel [value]="4">
        <ng-template #content let-activateCallback="activateCallback">
          <div class="flex flex-column h-12rem">
            <div
              class="border-2 border-dashed surface-border border-round surface-ground flex-auto flex justify-content-center align-items-center font-medium"
            >
              Content III
            </div>
          </div>
          <div class="flex pt-4 justify-content-start">
            <p-button label="Back" icon="pi pi-arrow-left" (onClick)="activateCallback(2)" />
          </div>
        </ng-template>
      </p-step-panel>
    </p-step-panels>
  </p-stepper>
</div>
