<div
  class="relative overflow-hidden flex flex-col items-center justify-center justify-self-center py-29 px-5 w-full"
>
  <div class="w-full text-left max-w-114.5">
    <app-logo />
  </div>

  <div class="py-34 max-w-114.5">
    <p class="h1 mb-15">Empower your learning journey with our smart exam platform.</p>

    <ul class="flex flex-col gap-9">
      @for (item of data; track item.heading) {
        <li class="flex gap-5 items-start">
          <img [src]="item.icon" alt="icon" class="border-[1.5px] border-primary p-1.5" />
          <div class="flex flex-col gap-2.5 font-geist">
            <p class="text-xl font-semibold text-primary">{{ item.heading }}</p>
            <p class="text-base text-black font-normal">{{ item.description }}</p>
          </div>
        </li>
      }
    </ul>
  </div>

  <!-- bg styles -->
  <div
    class="absolute top-30 -right-4 h-72 w-72 rounded-full bg-[radial-gradient(circle,#EFF6FFBF_0%,transparent_70%)] bg-primary blur-[200px]"
  ></div>
  <div
    class="absolute bottom-0 left-0 h-72 w-72 rounded-full bg-[radial-gradient(circle,#EFF6FFBF_0%,transparent_70%)] bg-primary blur-[200px]"
  ></div>
</div>
