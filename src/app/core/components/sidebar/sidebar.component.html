<div class="flex flex-col h-full p-10 bg-blue-50">
  <!-- header -->
  <div class="flex justify-between mb-15">
    <!-- logo -->
    <a routerLink="/" class="flex flex-col gap-3">
      <img src="/elevate-logo.svg" alt="elevate logo" />
      <div class="flex items-center gap-2.5">
        <img class="h-7.5" src="/folder-code.svg" alt="exam app logo" />
        <span class="font-semibold font-geist text-xl text-primary">Exam App</span>
      </div>
    </a>
    <!-- close button -->
    <p-button
      type="button"
      (click)="closeCallback($event)"
      icon="pi pi-times"
      styleClass="h-8 w-8 block lg:hidden"
      [text]="true"
    ></p-button>
  </div>

  <!-- navigation -->
  <div class="overflow-y-auto">
    <ul class="list-none p-0 m-0 overflow-hidden">
      <li>
        <a
          pRipple
          class="flex items-center gap-2.5 cursor-pointer p-4 rounded-border text-gray-500 hover:text-primary duration-150 transition-colors p-ripple"
          routerLink="/diplomas"
          routerLinkActive="text-primary bg-blue-100 border-blue-500 border"
        >
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M22 9.99987V15.9999M6 12.4999V15.9999C6 16.7955 6.63214 17.5586 7.75736 18.1212C8.88257 18.6838 10.4087 18.9999 12 18.9999C13.5913 18.9999 15.1174 18.6838 16.2426 18.1212C17.3679 17.5586 18 16.7955 18 15.9999V12.4999M21.42 10.9219C21.599 10.8429 21.7509 10.7131 21.8569 10.5487C21.9629 10.3842 22.0183 10.1923 22.0163 9.99661C22.0143 9.80095 21.9549 9.61019 21.8455 9.44795C21.7362 9.28571 21.5816 9.15913 21.401 9.08387L12.83 5.17987C12.5694 5.06102 12.2864 4.99951 12 4.99951C11.7136 4.99951 11.4306 5.06102 11.17 5.17987L2.6 9.07987C2.42196 9.15784 2.27051 9.286 2.16416 9.44868C2.05781 9.61136 2.00117 9.80151 2.00117 9.99587C2.00117 10.1902 2.05781 10.3804 2.16416 10.5431C2.27051 10.7057 2.42196 10.8339 2.6 10.9119L11.17 14.8199C11.4306 14.9387 11.7136 15.0002 12 15.0002C12.2864 15.0002 12.5694 14.9387 12.83 14.8199L21.42 10.9219Z"
              stroke="currentColor"
              stroke-width="1.25"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="font-normal text-base font-geist">Diplomas</span>
        </a>
      </li>
      <li>
        <a
          pRipple
          class="flex items-center gap-2.5 cursor-pointer p-4 rounded-border text-gray-500 hover:text-primary duration-150 transition-colors p-ripple"
          routerLink="account"
          routerLinkActive="text-primary bg-blue-100 border-blue-500 border"
        >
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M12 13C14.7614 13 17 10.7614 17 8C17 5.23858 14.7614 3 12 3C9.23858 3 7 5.23858 7 8C7 10.7614 9.23858 13 12 13ZM12 13C14.1217 13 16.1566 13.8429 17.6569 15.3431C19.1571 16.8434 20 18.8783 20 21M12 13C9.87827 13 7.84344 13.8429 6.34315 15.3431C4.84285 16.8434 4 18.8783 4 21"
              stroke="currentColor"
              stroke-width="1.25"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="font-normal text-base font-geist">Account Settings</span>
        </a>
      </li>
    </ul>
  </div>

  <!-- user card -->
  <div class="mt-auto flex gap-2.5 items-center">
    @if (user?.profilePhoto) {
      <img [src]="user?.profilePhoto" [alt]="user?.firstName" class="h-13.5 w-13.5" />
    } @else {
      <div class="h-13.5 w-13.5 border border-gray-500 flex items-center justify-center">
        <i class="pi pi-user"></i>
      </div>
    }
    <div class="flex gap-1 items-center">
      <div class="font-geist text-sm">
        <p class="text-primary">{{ user.firstName }}</p>
        <p class="text-gray-500">{{ user.email }}</p>
      </div>
      <!-- ellipsis button -->
      <p-button
        aria-label="profile manu"
        [text]="true"
        class="shrink-0 cursor-pointer remove-padding"
        (onClick)="toggle($event)"
      >
        <img src="/assets/icons/Menu.svg" alt="ellipsis icon" class="h-7 w-7" />
      </p-button>
      <!-- menu -->
      <p-popover #op>
        <div class="flex flex-col">
          <a
            class="flex items-center gap-1.5 p-4 cursor-pointer hover:text-primary"
            routerLink="/account"
            ><img src="/assets/icons/user.svg" alt="user icon" /> Account</a
          >
          <a
            class="flex items-center gap-1.5 p-4 cursor-pointer hover:text-primary"
            routerLink="/diplomas"
            ><img src="/assets/icons/dashboard.svg" alt="dashboard icon" /> Dashboard</a
          >
          <button
            class="flex items-center gap-1.5 p-4 cursor-pointer text-left text-red-600 hover:text-primary"
            (click)="logout()"
          >
            <img src="/assets/icons/log-out.svg" alt="logout icon" /> Logout
          </button>
        </div>
      </p-popover>
    </div>
  </div>
</div>
